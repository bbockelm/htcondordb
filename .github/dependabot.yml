# Managed by Dependabot: keep GitHub Actions current (including SHA-pinned actions,
# whose pins are bumped when the action cuts a new release). Grouped into a single
# weekly PR to keep the noise down.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  # The CI tool pins in .github/tools. A module of its own precisely so the
  # pins are visible here: nothing imports it, so bumping one cannot affect
  # the main module's build. See .github/tools/README.md.
  - package-ecosystem: "gomod"
    directory: "/.github/tools"
    schedule:
      interval: "weekly"
    groups:
      ci-tools:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
