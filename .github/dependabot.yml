# Managed by Dependabot: keep GitHub Actions current (including SHA-pinned actions,
# whose pins are bumped when the action cuts a new release). Grouped into a single
# weekly PR to keep the noise down.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  # The CI tool pins in .github/tools. A module of its own precisely so the
  # pins are visible here: nothing imports it, so bumping one cannot affect
  # the main module's build. See .github/tools/README.md.
  - package-ecosystem: "gomod"
    directory: "/.github/tools"
    schedule:
      interval: "weekly"
    groups:
      ci-tools:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  # Go modules, including the ones developed alongside this repo (classad,
  # cedar, golang-htcondor). Those were bumped by hand for a while, as a set,
  # when a matching change landed on both sides. Nothing reported when the
  # hand-bump did not happen, and it stopped happening: the root module sat on
  # an untagged golang-htcondor commit that was never on that repo's main
  # through five of its releases, one of which carried the UID_DOMAIN fix an
  # FS-authenticated peer needs to be authorized at all, and the three sync
  # modules are further behind still. A weekly PR that has to pass CI is a
  # better account of where we are than a convention.
  #
  # Every module is listed: grafana/ replaces the root with ../, so a shared
  # dependency bumped in one leaves the other's go.sum stale -- and grafana/'s
  # own CI job only triggers on grafana/**, so it is not the thing that tells
  # you.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/opensearchsync"
      - "/kafkasync"
      - "/archivedropbox"
      - "/grafana"
    schedule:
      interval: "weekly"
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  # The golang:<minor> builder image for the Grafana plugin E2E test. The tag
  # tracks the minor's newest patch on its own; Dependabot moves it to the
  # next minor.
  - package-ecosystem: "docker"
    directory: "/grafana/e2e"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
