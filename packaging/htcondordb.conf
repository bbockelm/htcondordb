# htcondordb, the HTCondor job/history database daemon.
#
# Installing this package does NOT enable the daemon. It defines where the
# binary is and leaves every line that would start it commented out, so a
# package upgrade can never turn a service on. Uncomment what you want.
#
# This file is %config(noreplace): your edits survive an upgrade, and the
# package's version of the file is written alongside as .rpmnew.
#
# Run it on the same host as the schedd, under condor_master, so it inherits
# the condor configuration and drops to the condor user.

# --- daemon under the master -----------------------------------------------
HTCONDORDB      = /usr/sbin/htcondordb
#DAEMON_LIST     = $(DAEMON_LIST), HTCONDORDB
#DC_DAEMON_LIST  = $(DC_DAEMON_LIST) +HTCONDORDB
HTCONDORDB_ARGS = -sock htcondordb

#HTCONDORDB_DEBUG = general:info cedar:info

# --- what it mirrors -------------------------------------------------------
# Tail this schedd's queue into the jobs table and its history into the
# history archive.
#HTCONDORDB_SYNC_SCHEDD = true

# --- persistent state ------------------------------------------------------
# The database lives in $(SPOOL)/htcondordb. Naming it, and the persisted
# security sessions, keeps condor_preen from removing files it does not
# recognise.
VALID_SPOOL_FILES = $(VALID_SPOOL_FILES) htcondordb sessions_*

# Keep security sessions across a restart, so clients are not forced to
# re-authenticate every time the daemon comes back.
SEC_PERSIST_SESSIONS = true

# --- exporters -------------------------------------------------------------
# The exporter launchers (kafkasync, opensearchsync, archivedropbox) are
# installed beside the daemon in /usr/sbin, which is where it looks for them.
# Each is configured through its own HTCONDORDB_EXPORTER_* settings; none is
# started unless configured.
